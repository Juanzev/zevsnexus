<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="robots" content="noindex">
    <title>Sem conexão · ZEVS Nexus</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <!-- Página de reserva do service worker: sem script (a CSP não permite inline) e sem dado da empresa. -->
    <main class="auth-shell flex items-center justify-center px-4 py-10">
      <div class="card w-full max-w-sm text-center">
        <img src="/icons/icon-192.png" alt="" width="56" height="56" class="mx-auto rounded-2xl">
        <h1 class="mt-5 text-xl font-bold tracking-tight text-slate-900">Sem conexão</h1>
        <p class="mt-2 text-sm leading-relaxed text-slate-600">
          O ZEVS Nexus precisa de internet para mostrar os dados da empresa. Confira o Wi-Fi ou os dados móveis e tente de novo.
        </p>
        <a href="/app" class="btn btn-primary mt-6 w-full">Tentar de novo</a>
      </div>
    </main>
  </body>
</html>
